<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1726">
<title>學生議會表決系統｜國立臺灣師範大學附屬高級中學學生議會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --ink:#0E1726; --muted:#556178; --line:#DDE3EC; --soft:#EEF1F6; --bg:#F4F6FA; --field:#C8D1DE;
  --yes:#347A52; --no:#BD5249; --abs:#A37800; --none:#0E1726; --away:#B4BCC9;
  --brand:#1D4ED8; --tie:#6D28D9; --ok-bg:#DCFCE7; --ok-ink:#166534;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
.num{font-family:Inter,'Noto Sans TC',sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.6}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--field);background:#fff;color:var(--ink);font-size:16px;text-decoration:none}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.danger{background:var(--no);border-color:var(--no);color:#fff;font-weight:700}
.btn.big{min-height:56px;font-size:17px;border-radius:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.field input,.field select{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--field);font-size:16px;font-weight:400;background:#fff;color:var(--ink);width:100%}
.field .hint{font-size:13px;font-weight:400;color:var(--muted)}
.logo{height:30px;width:30px;box-sizing:content-box;padding:3px;background:#fff;border-radius:10px;flex:none;display:block}
.logo-w{height:36px;width:36px;flex:none;display:block}
.logo-l{width:100%;max-width:360px;height:auto;align-self:flex-start;display:block;margin-bottom:10px}
.s-logo{height:calc(var(--u)*4.7 + 2px);width:calc(var(--u)*4.7 + 2px);flex:none;display:block;align-self:center}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.chip{display:inline-block;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft);white-space:nowrap}
.chip.dark{background:var(--ink);color:#fff;font-weight:700}
.chip.live{background:#DBE6FE;color:#1E3A8A;font-weight:700}
.err{color:var(--no);font-size:14px;min-height:1.4em}
.ok-pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ok-ink);background:var(--ok-bg);padding:6px 12px;border-radius:999px}
.topbar{background:var(--ink);color:#F2F5FA}
.topbar .btn{background:transparent;color:#F2F5FA;border-color:#4A5D7E;min-height:44px}
.topbar .btn.light{background:#F2F5FA;color:var(--ink);border-color:#F2F5FA;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--field);background:#fff;color:var(--ink);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.notice{max-width:560px;margin:15vh auto;padding:24px;line-height:1.7}

/* ── 議員手機 ── */
.v-wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.v-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:12px}
.v-title{font-size:17px;font-weight:900}
.v-me{font-size:13px;color:#A9B6CC}
.v-status{padding:10px 20px;font-size:14px;display:flex;align-items:center;gap:6px;background:#DBE6FE;color:#1E3A8A}
.v-status.warn{background:#FFEDD5;color:#7C2D12}
.v-main{flex:1;display:flex;flex-direction:column;padding:20px;gap:18px}
.v-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px}
.v-q{font-size:22px;font-weight:900;line-height:1.4;word-break:break-word}
.v-timer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.v-timer .num{font-size:34px;font-weight:800}
.v-opts{display:flex;flex-direction:column;gap:12px}
.v-opt{min-height:76px;border-radius:16px;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:var(--c);border:2px solid var(--c)}
.v-opt svg{display:none}
.v-opt[aria-pressed="true"]{background:var(--c);color:#fff}
.v-opt[aria-pressed="true"] svg{display:block}
.v-opt:disabled{opacity:1}
.v-opt:disabled:not([aria-pressed="true"]){opacity:.35}
.v-confirm{min-height:60px;border-radius:16px;font-size:20px}
.v-hint{font-size:15px;line-height:1.6;text-align:center}
.v-foot{margin-top:auto;display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.v-login{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:32px 24px}
.v-login h1{font-size:30px;font-weight:900}

/* ── 秘書處 ── */
.a-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.a-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding-top:24px;padding-bottom:48px}
.a-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px}
.a-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.a-side h2,.a-main h2{font-size:18px;font-weight:700}
.m-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--soft)}
.m-dot{width:8px;height:8px;border-radius:4px;background:var(--away);flex:none}
.m-dot.on{background:var(--brand)}
.m-dist{font-size:15px;font-weight:700;min-width:76px}
.m-name{font-size:14px;color:var(--muted);flex:1;min-width:0}
.m-online{font-size:12px;color:var(--ok-ink)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.tallies{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tally{padding:14px 16px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.tally .num{font-size:32px;font-weight:800}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.table-box{overflow-x:auto}
table{width:100%;min-width:680px;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:8px 10px;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--soft);vertical-align:top;white-space:nowrap}
td.wide{white-space:normal;min-width:280px}

/* ── 投影大螢幕 ── */
.s-wrap{--u:min(1vw,1.778vh);height:100vh;overflow:hidden;background:#fff;display:flex;flex-direction:column;gap:calc(var(--u)*1.5);padding:calc(var(--u)*2) calc(var(--u)*3)}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--u)*2)}
.s-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
.s-meta{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--u)*.6);font-size:calc(var(--u)*1)}
.s-meta .org{color:var(--muted);letter-spacing:.04em;margin-right:calc(var(--u)*.4)}
.s-meta .chip{font-size:calc(var(--u)*.95);padding:calc(var(--u)*.25) calc(var(--u)*.75)}
.s-title{font-size:calc(var(--u)*2);font-weight:900;line-height:1.35;word-break:break-word}
.s-timer{flex:none;display:flex;align-items:baseline;gap:calc(var(--u)*.7);padding:calc(var(--u)*.6) calc(var(--u)*1.4);border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.s-timer span:first-child{font-size:calc(var(--u)*1);color:var(--muted)}
.s-timer .num{font-size:calc(var(--u)*3.5);font-weight:800;line-height:1}
.s-result{flex:none;display:flex;flex-direction:column;gap:2px;padding:calc(var(--u)*.75) calc(var(--u)*1.5);border-radius:14px;color:#fff;font-size:calc(var(--u)*.95)}
.s-result b{font-size:calc(var(--u)*2.5);font-weight:900;line-height:1.15}
.s-body{flex:1;min-height:0;display:flex;flex-direction:column}
.s-grid{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);gap:calc(var(--u)*var(--g,1))}
.s-tile{min-height:0;min-width:0;overflow:hidden;border-radius:calc(var(--u)*.8);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.25);text-align:center;padding:calc(var(--u)*.4)}
.s-tile .d{font-size:calc(var(--u)*var(--df,1.05));color:var(--muted);white-space:nowrap}
.s-tile .n{font-size:calc(var(--u)*var(--nf,2.5));font-weight:900;line-height:1.2;white-space:nowrap}
.s-anon{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.8);border-radius:16px;background:var(--bg)}
.s-anon b{font-size:calc(var(--u)*2.5);font-weight:900}
.s-anon span{font-size:calc(var(--u)*1.25);color:var(--muted)}
.s-foot{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1.5);padding-top:calc(var(--u)*1.1);border-top:1px solid var(--line)}
.s-tallies{display:flex;align-items:center;gap:calc(var(--u)*2);flex-wrap:wrap}
.s-t{display:flex;align-items:center;gap:calc(var(--u)*.6);font-size:calc(var(--u)*1.4);font-weight:700}
.s-t i{width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:4px;display:inline-block}
.s-t .num{font-size:calc(var(--u)*1.9);font-weight:800}
.s-sum{font-size:calc(var(--u)*1.25);color:var(--muted)}
.s-sum b{color:var(--ink)}
</style>
</head>

const TONE = { pass: 'var(--yes)', fail: 'var(--no)', tie: 'var(--tie)' };

const keysFor = kind => kind === '人事案' ? ['yes', 'no'] : ['yes', 'no', 'abs'];

/* 伺服器時間校正，讓每台裝置倒數一致 */
let offset = 0;
const now = () => Date.now() + offset;
const leftSec = endsAt => Math.max(0, Math.ceil((endsAt - now()) / 1000));
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

async function api(action, data = {}) {
  const t0 = Date.now();
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, data))
  });
  const j = await res.json();
  if (j.now) offset = j.now - Math.round((t0 + Date.now()) / 2);
  return j;
}

function needTextFor(rule, kind, present, total) {
  const L = labelsFor(kind);
  let n = null;
  if (rule === '出席過半數') n = Math.floor(present / 2) + 1;
  if (rule === '出席三分之二') n = Math.ceil(present * 2 / 3);
  if (rule === '全體過半數') n = Math.floor(total / 2) + 1;
  if (rule === '全體三分之二') n = Math.ceil(total * 2 / 3);
  return n === null ? `${L.yes}多於${L.no}即通過${kind === '人事案' ? '' : '（棄權不計）'}` : `${L.yes}需 ≥ ${n} 票`;
}

/* ───── 路由與輪詢 ───── */
let gen = 0, pollTimer = null;
const tickers = new Set();
setInterval(() => tickers.forEach(f => f()), 250);

function poll(fn, ms) {
  const g = gen;
  const run = async () => {
    if (g !== gen) return;
    try { await fn(); } catch (e) { console.error(e); }
    if (g === gen) pollTimer = setTimeout(run, ms);
  };
  run();
}

function route() {
  gen++;
  clearTimeout(pollTimer);
  tickers.clear();
  document.body.style.background = '';
  if (API_URL.indexOf('請貼上') >= 0) {
    $('#app').innerHTML = '<div class="card notice"><h2>尚未設定後端網址</h2><p class="muted">請在 index.html 開頭的 <code>API_URL</code> 貼上 Apps Script 網頁應用程式的部署網址。</p></div>';
    return;
  }
  const h = location.hash.replace(/^#\/?/, '');
  if (h === 'screen') Screen();
  else if (h === 'admin') Admin();
  else Voter();
}
window.addEventListener('hashchange', route);

/* ═══════════ 議員手機 ═══════════ */
function Voter() {
  const token = store.get('vote_token');
  if (!token) return VoterLogin();
  const app = $('#app');
  app.innerHTML = `
    <div class="v-wrap">
      <header class="topbar"><div class="v-bar">
        <div class="row" style="gap:12px;flex-wrap:nowrap"><img class="logo-w" src="${LOGO_W}" alt="學生議會標誌"><div><div class="v-title">學生議會表決系統</div><div class="v-me" id="me">載入中…</div></div></div>
        <button class="btn" id="logout">登出</button>
      </div></header>
      <div class="v-status" id="status">連線中…</div>
      <main class="v-main" id="main"></main>
    </div>`;
  $('#logout').onclick = async () => {
    try { await api('logout', { token }); } catch (e) {}
    store.set('vote_token', null);
    route();
  };

  let data = null, viewKey = '', selected = null, sending = false, hintErr = '';
  const main = $('#main');

  function render() {
    const v = data.vote;
    $('#me').textContent = `${data.me.cls} · ${data.me.name}`;
    const st = $('#status');
    st.className = 'v-status' + (data.present ? '' : ' warn');
    st.innerHTML = data.present ? `${CHECK_SM}已簽到 · ${esc(data.meeting)}` : '目前未簽到，請洽議會秘書處';

    let mode = 'wait';
    if (v && v.status === 'voting') mode = v.eligible ? 'ballot' : 'inelig';
    else if (v && v.status === 'closed') mode = 'closed';
    const key = mode + '|' + (v ? v.id : '');
    if (key !== viewKey) {
      viewKey = key; selected = null; sending = false; hintErr = '';
      tickers.clear();
      if (mode === 'wait') {
        main.innerHTML = `<div class="v-empty"><h2 style="font-size:20px">目前沒有進行中的表決</h2><p class="muted" style="line-height:1.6">秘書處開始表決後，此頁會自動顯示投票按鈕。</p></div>`;
      } else if (mode === 'inelig') {
        main.innerHTML = `${head(v)}<div class="v-empty"><h2 style="font-size:18px">你目前未簽到</h2><p class="muted" style="line-height:1.6">表決截止前完成簽到即可投票，請洽秘書處。</p></div>`;
      } else if (mode === 'closed') {
        main.innerHTML = `${head(v)}<h2 style="font-size:26px;font-weight:900">表決已截止</h2>
          <div class="v-timer"><span class="muted">你的投票</span><span id="mine" style="font-size:24px;font-weight:900"></span></div>
          <p class="muted" style="line-height:1.6">表決結果以投影畫面及主席宣告為準。</p>`;
      } else {
        const L = labelsFor(v.kind);
        main.innerHTML = `${head(v)}
          <div class="v-timer"><span class="muted">剩餘時間</span><span class="num" id="left">--:--</span></div>
          <div class="v-opts">${keysFor(v.kind).map(k => `<button class="v-opt" data-k="${k}" style="--c:${COLORS[k]}" aria-pressed="false">${CHECK}${L[k]}</button>`).join('')}</div>
          <p class="v-hint" id="hint" role="status"></p>
          <div class="v-foot"><span>門檻：${esc(v.rule)}</span><span class="num" id="cnt"></span></div>`;
        main.querySelectorAll('.v-opt').forEach(b => b.onclick = () => {
          if (sending || data.vote.status !== 'voting' || leftSec(data.vote.endsAt) === 0) return;
          selected = b.dataset.k; hintErr = '';
          submit();                      // 點選即送出，無須再按確認
        });
        let wasEnded = false;
        const tick = () => {
          const s = leftSec(data.vote.endsAt);
          const el = $('#left');
          if (!el) return;
          el.textContent = fmt(s);
          el.style.color = s <= 10 ? 'var(--no)' : '';
          if ((s === 0) !== wasEnded) { wasEnded = s === 0; update(); }
        };
        tickers.add(tick); tick();
      }
    }
    update();
  }

  function head(v) {
    return `<div style="display:flex;flex-direction:column;gap:8px">
      <div class="row" style="gap:6px"><span class="chip dark">${v.named ? '記名表決' : '不記名表決'}</span><span class="chip">${esc(v.kind)}</span>${v.billId ? `<span class="chip num">${esc(v.billId)}</span>` : ''}</div>
      <h2 class="v-q">${esc(v.title)}</h2></div>`;
  }

  /* 已確認送出的選項（伺服器為準；不記名表決截止後改用本機紀錄顯示） */
  function confirmed() {
    const v = data.vote;
    if (!v) return null;
    return v.myChoice || store.get('vote_choice_' + v.id);
  }

  function update() {
    const v = data.vote;
    if (!v) return;
    const L = labelsFor(v.kind);
    const done = confirmed();
    const ended = v.status !== 'voting' || leftSec(v.endsAt) === 0;
    const shown = ended ? (done || selected) : (selected || done);
    main.querySelectorAll('.v-opt').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.k === shown));
      b.disabled = sending || ended;
    });
    const hint = $('#hint');
    if (hint) {
      hint.style.color = hintErr ? 'var(--no)' : '';
      hint.textContent = hintErr
        || (ended ? (done ? `表決時間已到。你的投票：${L[done]}。` : '表決時間已到。')
          : sending ? '送出中…'
          : done ? `已投：${L[done]}。截止前點選其他選項即可更改，以最後一次為準。`
          : '點選選項即送出投票，截止前可更改。');
    }
    const cnt = $('#cnt');
    if (cnt) cnt.textContent = `已投 ${v.voted} / 出席 ${v.eligibleCount}`;
    const mine = $('#mine');
    if (mine) { mine.textContent = done ? L[done] : '未投票'; mine.style.color = done ? COLORS[done] : 'var(--muted)'; }
  }

  async function submit() {
    const v = data.vote;
    if (!selected || sending || selected === confirmed()) return;
    sending = true; hintErr = ''; update();
    try {
      const r = await api('vote', { token, choice: selected });
      if (r.relogin) { store.set('vote_token', null); return route(); }
      if (r.myChoice) { v.myChoice = r.myChoice; store.set('vote_choice_' + v.id, r.myChoice); }
      if (!r.ok) hintErr = r.error;
    } catch (e) { hintErr = '網路連線失敗，請再點選一次'; }
    selected = null; sending = false; update();
  }

  poll(async () => {
    const r = await api('me', { token });
    if (r.relogin) { store.set('vote_token', null); return route(); }
    if (!r.ok) { $('#status').textContent = r.error; return; }
    data = r;
    render();
  }, POLL_MS.voter);
}

    $('#next').onclick = () => { dismissed = v.id; store.set('vote_dismissed', v.id); renderCurrent(); };
  }

    const r = await api('admin', { adminToken });
    if (r.relogin) { store.set('vote_admin', null); return route(); }
    if (!r.ok) return showErr(r.error);

    renderMembers();

    renderCurrent();
  }

  poll(refresh, POLL_MS.admin);

function Screen() {
  document.body.style.background = '#fff';
  $('#app').innerHTML = `
    <div class="s-wrap" id="sw" title="按 F 或雙擊切換全螢幕">
      <header class="s-head">
        <img class="s-logo" src="${LOGO}" alt="學生議會標誌">
        <div class="s-info"><div class="s-meta" id="meta"></div><h1 class="s-title clamp2" id="title">連線中…</h1></div>
        <div id="corner"></div>
      </header>
      <div class="s-body" id="body"></div>
      <footer class="s-foot" id="foot"></footer>
    </div>`;
  const toggleFs = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); };
  $('#sw').ondblclick = toggleFs;
  document.onkeydown = e => { if (location.hash.indexOf('screen') >= 0 && (e.key === 'f' || e.key === 'F')) toggleFs(); };

  let last = '', data = null;
  const tick = () => {
    const el = $('#sleft');
    if (!el || !data || !data.vote) return;
    const s = leftSec(data.vote.endsAt);
    el.textContent = fmt(s);
    el.style.color = s <= 10 ? 'var(--no)' : '';
  };
  tickers.add(tick);

  /* 依人數自動排版：20 席以內 5 欄，超過時固定 5 排、欄數增加（50 席 = 10 欄 × 5 排） */
  function tiles(list, colorOf) {
    const n = Math.max(1, list.length);
    const cols = n <= 8 ? 4 : n <= 20 ? 5 : Math.ceil(n / 5);
    const rows = Math.ceil(n / cols);
    const gap = cols >= 8 ? 0.6 : 1;
    const tileW = (94 - (cols - 1) * gap) / cols;   // 以 --u 為單位
    const tileH = (37 - (rows - 1) * gap) / rows;
    const nf = Math.min(3, tileW * 0.2, tileH * 0.45);
    return `<div class="s-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));--g:${gap};--nf:${nf.toFixed(2)}">${list.map(t => `
      <div class="s-tile"><span class="n" style="color:${colorOf(t)}">${esc(t.cls)}</span></div>`).join('')}</div>`;
  }

  function render() {
    const v = data.vote;
    const org = `<span class="org">國立臺灣師範大學附屬高級中學學生議會 · ${esc(data.meeting)}</span>`;
    if (!v) {
      $('#meta').innerHTML = org;
      $('#title').textContent = '目前沒有進行中的表決';
      $('#corner').innerHTML = '';
      $('#body').innerHTML = tiles(data.members, m => m.present ? 'var(--none)' : 'var(--away)');
      $('#foot').innerHTML = `<span class="s-sum">深色為已簽到，淺灰為未出席</span><span class="s-sum num">出席 <b>${data.presentCount}</b> ／ 全體 ${data.total}</span>`;
      return;
    }
    const L = labelsFor(v.kind), t = v.tallies;
    $('#meta').innerHTML = org +
      (v.billId ? `<span class="chip num">${esc(v.billId)}</span>` : '') +
      `<span class="chip">${esc(v.kind)}</span><span class="chip dark">${v.named ? '記名表決' : '不記名表決'}</span>` +
      `<span class="chip">${esc(v.rule)}（${esc(v.needText)}）</span>`;
    $('#title').textContent = v.title;
    $('#corner').innerHTML = v.status === 'voting'
      ? `<div class="s-timer"><span>剩餘</span><span class="num" id="sleft">--:--</span></div>`
      : `<div class="s-result" style="background:${TONE[v.result.tone]}"><span>表決已截止</span><b>${esc(v.result.text)}</b><span>${esc(v.result.note)}</span></div>`;
    $('#body').innerHTML = v.named
      ? tiles(v.tiles, x => COLORS[x.s])
      : `<div class="s-anon"><b>不記名表決</b><span>不顯示個別議員投票，僅公布票數</span></div>`;
    $('#foot').innerHTML = `
      <div class="s-tallies">
        ${keysFor(v.kind).map(k => `<span class="s-t"><i style="background:${COLORS[k]}"></i>${L[k]}<span class="num" style="color:${COLORS[k]}">${t[k]}</span></span>`).join('')}
        <span class="s-t" style="color:var(--muted)"><i style="background:var(--none)"></i>未投票<span class="num">${t.notVoted}</span></span>
      </div>
      <span class="s-sum num">已投 <b>${t.voted}</b> ／ 出席 <b>${t.eligible}</b> ／ 全體 ${v.total}</span>`;
    tick();
  }

  poll(async () => {
    const r = await api('screen');
    if (!r.ok) { $('#title').textContent = r.error; return; }
    data = r;
    const sig = JSON.stringify(r.vote) + JSON.stringify(r.members) + r.meeting;
    if (sig !== last) { last = sig; render(); }
  }, POLL_MS.screen);
}

route();
</script>
</body>
</html>
