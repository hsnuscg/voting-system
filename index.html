<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1726">
<title>學生議會表決系統｜國立臺灣師範大學附屬高級中學學生議會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;700;900&display=swap">
<style>
:root{
  --ink:#0E1726; --muted:#556178; --line:#DDE3EC; --soft:#EEF1F6; --bg:#F4F6FA; --field:#C8D1DE;
  --serif:'Noto Serif TC','Songti TC','SimSun','PMingLiU',serif; --yes:#347A52; --no:#BD5249; --abs:#A37800; --none:#0E1726; --away:#B4BCC9;
  --brand:#1D4ED8; --tie:#6D28D9; --ok-bg:#DCFCE7; --ok-ink:#166534;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
.num{font-family:Inter,'Noto Sans TC',sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.6}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:1px solid var(--field);background:#fff;color:var(--ink);font-size:16px;text-decoration:none}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.danger{background:var(--no);border-color:var(--no);color:#fff;font-weight:700}
.btn.big{min-height:56px;font-size:17px;}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.field input,.field select{min-height:48px;padding:0 14px;border:1px solid var(--field);font-size:16px;font-weight:400;background:#fff;color:var(--ink);width:100%}
.field .hint{font-size:13px;font-weight:400;color:var(--muted)}
.logo{height:30px;width:30px;box-sizing:content-box;padding:3px;background:#fff;flex:none;display:block}
.logo-w{height:36px;width:36px;flex:none;display:block}
.s-logo{height:36px;width:36px;flex:none;display:block;align-self:center}
.card{background:#fff;border:1px solid var(--line);padding:20px}
.chip{display:inline-block;font-size:13px;padding:4px 10px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.chip.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.chip.live{background:#DBE6FE;border-color:#DBE6FE;color:#1E3A8A;font-weight:700}
.chips{display:flex;flex-wrap:nowrap}
.chips .chip+.chip{margin-left:-1px}
.btns{gap:0}
.btns>.btn+.btn{margin-left:-1px}
.err{color:var(--no);font-size:14px;min-height:1.4em}
.ok-pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ok-ink);background:var(--ok-bg);padding:6px 12px;}
.topbar{background:var(--ink);color:#F2F5FA}
.topbar .btn{background:transparent;color:#F2F5FA;border-color:#4A5D7E;min-height:44px}
.topbar .btn.light{background:#F2F5FA;color:var(--ink);border-color:#F2F5FA;font-weight:700}
.seg{display:flex;gap:0;flex-wrap:wrap}
.seg button+button{margin-left:-1px}
.seg button[aria-pressed="true"]{position:relative;z-index:1}
.seg button{min-height:44px;padding:0 14px;border:1px solid var(--field);background:#fff;color:var(--ink);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.notice{max-width:560px;margin:15vh auto;padding:24px;line-height:1.7}

/* ── 議員手機 ── */
.v-wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.v-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:12px}
.v-title{font-family:var(--serif);font-size:17px;font-weight:900}
.v-me{font-size:13px;color:#A9B6CC}
.v-status{padding:10px 20px;font-size:14px;display:flex;align-items:center;gap:6px;background:#DBE6FE;color:#1E3A8A}
.v-status.warn{background:#FFEDD5;color:#7C2D12}
.v-main{flex:1;display:flex;flex-direction:column;padding:20px;gap:18px}
.v-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px}
.v-q{font-size:22px;font-weight:900;line-height:1.4;word-break:break-word}
.v-timer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border:1px solid var(--line)}
.v-timer .num{font-size:34px;font-weight:800}
.v-opts{display:flex;flex-direction:column;gap:12px}
.v-opt{min-height:76px;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:var(--c);border:2px solid var(--c)}
.v-opt svg{display:none}
.v-opt[aria-pressed="true"]{background:var(--c);color:#fff}
.v-opt[aria-pressed="true"] svg{display:block}
.v-opt:disabled{opacity:1}
.v-opt:disabled:not([aria-pressed="true"]){opacity:.35}
.v-confirm{min-height:60px;font-size:20px}
.v-hint{font-size:15px;line-height:1.6;text-align:center}
.v-foot{margin-top:auto;display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.v-login{max-width:440px;margin:0 auto;min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;gap:28px;padding:32px 24px}

/* ── 秘書處 ── */
.a-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.a-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding-top:24px;padding-bottom:48px}
.a-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px}
.a-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.a-side h2,.a-main h2{font-size:18px;font-weight:700}
.m-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--soft)}
.m-dot{border-radius:50%;width:8px;height:8px;background:var(--away);flex:none}
.m-dot.on{background:var(--brand)}
.m-dist{font-size:15px;font-weight:700;min-width:56px}
.m-name{font-size:14px;color:var(--muted);flex:1;min-width:0}
.m-online{font-size:12px;color:var(--ok-ink)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.tallies{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line);background:#fff}
.tally{padding:14px 16px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.tally:first-child{border-left:0}
.tally .num{font-size:32px;font-weight:800}
.sw{display:inline-block;width:10px;height:10px;margin-right:6px}
.table-box{overflow-x:auto}
table{width:100%;min-width:680px;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:8px 10px;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--soft);vertical-align:top;white-space:nowrap}
td.wide{white-space:normal;min-width:280px}

/* ── 投影大螢幕 ── */
.s-wrap{--u:min(1vw,1.778vh);--serif:'Noto Serif TC','Songti TC','PMingLiU',serif;height:100vh;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.s-bar{flex:none;background:var(--ink);color:#F2F5FA;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px calc(var(--u)*3)}
.s-org{flex:1;min-width:0;display:flex;align-items:baseline;gap:14px;white-space:nowrap;overflow:hidden}
.s-org .o{font-family:var(--serif);font-size:20px;font-weight:900}
.s-org .m{font-size:15px;color:#A9B6CC}
.s-end{flex:none;min-height:44px;display:flex;align-items:center;padding:0 16px;border:1px solid rgba(255,255,255,.5);font-size:15px;letter-spacing:.3em;font-weight:500}
.s-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.5) calc(var(--u)*3) calc(var(--u)*1.2)}
.s-lab{font-size:calc(var(--u)*1);color:var(--muted);margin-bottom:calc(var(--u)*.3)}
.s-title{font-family:var(--serif);font-size:calc(var(--u)*2.8);font-weight:900;line-height:1.3;word-break:break-word}
.s-facts{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.s-fact{padding:calc(var(--u)*.8) calc(var(--u)*1.2);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:calc(var(--u)*.3);min-width:0}
.s-fact:first-child{border-left:0;padding-left:0}
.s-fact:last-child{align-items:flex-end;text-align:right;padding-right:0}
.s-fact .l{font-size:calc(var(--u)*.95);color:var(--muted)}
.s-fact .v{font-size:calc(var(--u)*1.7);font-weight:700;line-height:1.3}
.s-fact .s{font-size:calc(var(--u)*.95);color:var(--muted);line-height:1.4}
.s-fact .r{font-size:calc(var(--u)*3.2);font-weight:900;line-height:1.05}
.s-body{flex:1;min-height:0;display:flex;flex-direction:column}
.s-grid{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.s-tile{min-height:0;min-width:0;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(var(--u)*.3)}
.s-tile .n{font-size:calc(var(--u)*var(--nf,2.5));font-weight:900;line-height:1.2;white-space:nowrap}
.s-anon{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.8);border:1px solid var(--line);background:#fff}
.s-anon b{font-family:var(--serif);font-size:calc(var(--u)*2.8);font-weight:900}
.s-anon span{font-size:calc(var(--u)*1.25);color:var(--muted)}
.s-foot{flex:none;display:flex;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.s-fc{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*.8);padding:calc(var(--u)*.7) calc(var(--u)*1.2);border-left:1px solid var(--line)}
.s-fc:first-child{border-left:0;padding-left:0}
.s-fc.sum{flex:1.3;justify-content:flex-end;gap:calc(var(--u)*1.4);padding-right:0;color:var(--muted);font-size:calc(var(--u)*1.25)}
.s-fc.note{flex:2;justify-content:flex-start;color:var(--muted);font-size:calc(var(--u)*1.25)}
.s-fc .lb{display:flex;align-items:center;gap:calc(var(--u)*.6);font-size:calc(var(--u)*1.4);font-weight:700}
.s-fc .lb i{width:calc(var(--u)*1);height:calc(var(--u)*1);display:inline-block;box-sizing:border-box}
.s-fc .num{font-size:calc(var(--u)*2.6);font-weight:800;line-height:1}
.s-sum b{color:var(--ink)}
.s-sum b{color:var(--ink)}
</style>
</head>

const COLORS = { yes: 'var(--yes)', no: 'var(--no)', abs: 'var(--abs)', none: 'var(--none)', away: 'var(--away)' };
const TONE = { pass: 'var(--yes)', fail: 'var(--no)', tie: 'var(--tie)' };
const RULES = ['簡單多數決', '出席過半數', '出席三分之二', '全體過半數', '全體三分之二'];
const labelsFor = kind => kind === '人事案' ? { yes: '同意', no: '不同意' } : { yes: '贊成', no: '反對', abs: '棄權' };
const keysFor = kind => kind === '人事案' ? ['yes', 'no'] : ['yes', 'no', 'abs'];
const CHECK = '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const CHECK_SM = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

/* 伺服器時間校正，讓每台裝置倒數一致 */
let offset = 0;
const now = () => Date.now() + offset;
const leftSec = endsAt => Math.max(0, Math.ceil((endsAt - now()) / 1000));
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

async function api(action, data = {}) {
  const t0 = Date.now();
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, data))
  });
  const j = await res.json();
  if (j.now) offset = j.now - Math.round((t0 + Date.now()) / 2);
  return j;
}

function needTextFor(rule, kind, present, total) {
  const L = labelsFor(kind);
  let n = null;
  if (rule === '出席過半數') n = Math.floor(present / 2) + 1;
  if (rule === '出席三分之二') n = Math.ceil(present * 2 / 3);
  if (rule === '全體過半數') n = Math.floor(total / 2) + 1;
  if (rule === '全體三分之二') n = Math.ceil(total * 2 / 3);
  return n === null ? `${L.yes}多於${L.no}即通過${kind === '人事案' ? '' : '（棄權不計）'}` : `${L.yes}需 ≥ ${n} 票`;
}

/* ───── 路由與輪詢 ───── */
let gen = 0, pollTimer = null;
const tickers = new Set();
setInterval(() => tickers.forEach(f => f()), 250);

function poll(fn, ms) {
  const g = gen;
  const run = async () => {
    if (g !== gen) return;
    try { await fn(); } catch (e) { console.error(e); }
    if (g === gen) pollTimer = setTimeout(run, ms);
  };
  run();
}

function route() {
  gen++;
  clearTimeout(pollTimer);
  tickers.clear();
  document.body.style.background = '';
  if (API_URL.indexOf('請貼上') >= 0) {
    $('#app').innerHTML = '<div class="card notice"><h2>尚未設定後端網址</h2><p class="muted">請在 index.html 開頭的 <code>API_URL</code> 貼上 Apps Script 網頁應用程式的部署網址。</p></div>';
    return;
  }
  const h = location.hash.replace(/^#\/?/, '');
  if (h === 'screen') Screen();
  else if (h === 'admin') Admin();
  else Voter();
}
window.addEventListener('hashchange', route);

/* ═══════════ 議員手機 ═══════════ */
function Voter() {
  const token = store.get('vote_token');
  if (!token) return VoterLogin();
  const app = $('#app');
  app.innerHTML = `
    <div class="v-wrap">
      <header class="topbar"><div class="v-bar">
        <div class="row" style="gap:12px;flex-wrap:nowrap"><img class="logo-w" src="${LOGO_W}" alt="學生議會標誌"><div><div class="v-title">學生議會表決系統</div><div class="v-me" id="me">載入中…</div></div></div>
        <button class="btn" id="logout">登出</button>
      </div></header>
      <div class="v-status" id="status">連線中…</div>
      <main class="v-main" id="main"></main>
    </div>`;
  $('#logout').onclick = async () => {
    try { await api('logout', { token }); } catch (e) {}
    store.set('vote_token', null);
    route();
  };

  let data = null, viewKey = '', selected = null, sending = false, hintErr = '';
  const main = $('#main');

  function render() {
    const v = data.vote;
    $('#me').textContent = `${data.me.cls} · ${data.me.name}`;
    const st = $('#status');
    st.className = 'v-status' + (data.present ? '' : ' warn');
    st.innerHTML = data.present ? `${CHECK_SM}已簽到 · ${esc(data.meeting)}` : '目前未簽到，請洽議會秘書處';

    let mode = 'wait';
    if (v && v.status === 'voting') mode = v.eligible ? 'ballot' : 'inelig';
    else if (v && v.status === 'closed') mode = 'closed';
    const key = mode + '|' + (v ? v.id : '');
    if (key !== viewKey) {
      viewKey = key; selected = null; sending = false; hintErr = '';
      tickers.clear();
      if (mode === 'wait') {
        main.innerHTML = `<div class="v-empty"><h2 style="font-size:20px">目前沒有進行中的表決</h2><p class="muted" style="line-height:1.6">秘書處開始表決後，此頁會自動顯示投票按鈕。</p></div>`;
      } else if (mode === 'inelig') {
        main.innerHTML = `${head(v)}<div class="v-empty"><h2 style="font-size:18px">你目前未簽到</h2><p class="muted" style="line-height:1.6">表決截止前完成簽到即可投票，請洽秘書處。</p></div>`;
      } else if (mode === 'closed') {
        main.innerHTML = `${head(v)}<h2 style="font-size:26px;font-weight:900">表決已截止</h2>
          <div class="v-timer"><span class="muted">你的投票</span><span id="mine" style="font-size:24px;font-weight:900"></span></div>
          <p class="muted" style="line-height:1.6">表決結果以投影畫面及主席宣告為準。</p>`;
      } else {
        const L = labelsFor(v.kind);
        main.innerHTML = `${head(v)}
          <div class="v-timer"><span class="muted">剩餘時間</span><span class="num" id="left">--:--</span></div>
          <div class="v-opts">${keysFor(v.kind).map(k => `<button class="v-opt" data-k="${k}" style="--c:${COLORS[k]}" aria-pressed="false">${CHECK}${L[k]}</button>`).join('')}</div>
          <p class="v-hint" id="hint" role="status"></p>
          <div class="v-foot"><span>門檻：${esc(v.rule)}</span><span class="num" id="cnt"></span></div>`;
        main.querySelectorAll('.v-opt').forEach(b => b.onclick = () => {
          if (sending || data.vote.status !== 'voting' || leftSec(data.vote.endsAt) === 0) return;
          selected = b.dataset.k; hintErr = '';
          submit();                      // 點選即送出，無須再按確認
        });
        let wasEnded = false;
        const tick = () => {
          const s = leftSec(data.vote.endsAt);
          const el = $('#left');
          if (!el) return;
          el.textContent = fmt(s);
          el.style.color = s <= 10 ? 'var(--no)' : '';
          if ((s === 0) !== wasEnded) { wasEnded = s === 0; update(); }
        };
        tickers.add(tick); tick();
      }
    }
    update();
  }

  function head(v) {
    return `<div style="display:flex;flex-direction:column;gap:8px">
      <div class="chips"><span class="chip dark">${v.named ? '記名表決' : '不記名表決'}</span><span class="chip">${esc(v.kind)}</span>${v.billId ? `<span class="chip num">${esc(v.billId)}</span>` : ''}</div>
      <h2 class="v-q">${esc(v.title)}</h2></div>`;
  }

  /* 已確認送出的選項（伺服器為準；不記名表決截止後改用本機紀錄顯示） */
  function confirmed() {
    const v = data.vote;
    if (!v) return null;
    return v.myChoice || store.get('vote_choice_' + v.id);
  }

  function update() {
    const v = data.vote;
    if (!v) return;
    const L = labelsFor(v.kind);
    const done = confirmed();
    const ended = v.status !== 'voting' || leftSec(v.endsAt) === 0;
    const shown = ended ? (done || selected) : (selected || done);
    main.querySelectorAll('.v-opt').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.k === shown));
      b.disabled = sending || ended;
    });
    const hint = $('#hint');
    if (hint) {
      hint.style.color = hintErr ? 'var(--no)' : '';
      hint.textContent = hintErr
        || (ended ? (done ? `表決時間已到。你的投票：${L[done]}。` : '表決時間已到。')
          : sending ? '送出中…'
          : done ? `已投：${L[done]}。截止前點選其他選項即可更改，以最後一次為準。`
          : '點選選項即送出投票，截止前可更改。');
    }
    const cnt = $('#cnt');
    if (cnt) cnt.textContent = `已投 ${v.voted} / 出席 ${v.eligibleCount}`;
    const mine = $('#mine');
    if (mine) { mine.textContent = done ? L[done] : '未投票'; mine.style.color = done ? COLORS[done] : 'var(--muted)'; }
  }

  async function submit() {
    const v = data.vote;
    if (!selected || sending || selected === confirmed()) return;
    sending = true; hintErr = ''; update();
    try {
      const r = await api('vote', { token, choice: selected });
      if (r.relogin) { store.set('vote_token', null); return route(); }
      if (r.myChoice) { v.myChoice = r.myChoice; store.set('vote_choice_' + v.id, r.myChoice); }
      if (!r.ok) hintErr = r.error;
    } catch (e) { hintErr = '網路連線失敗，請再點選一次'; }
    selected = null; sending = false; update();
  }

  poll(async () => {
    const r = await api('me', { token });
    if (r.relogin) { store.set('vote_token', null); return route(); }
    if (!r.ok) { $('#status').textContent = r.error; return; }
    data = r;
    render();
  }, POLL_MS.voter);
}

function VoterLogin() {
  $('#app').innerHTML = `
    <header class="topbar"><div class="v-bar" style="max-width:440px;margin:0 auto;justify-content:flex-start;padding:12px 24px"><div class="row" style="gap:12px;flex-wrap:nowrap"><img class="logo-w" src="${LOGO_W}" alt="學生議會標誌"><div><div class="v-title">學生議會表決系統</div></div></div></div></header>
    <div class="v-login">
      <form id="f" style="display:flex;flex-direction:column;gap:16px">
        <label class="field">帳號<input name="account" autocomplete="username" autocapitalize="none" required></label>
        <label class="field">密碼<input name="password" type="password" autocomplete="current-password" required></label>
        <p class="err" id="err" role="alert"></p>
        <button class="btn primary big" type="submit" id="go">登入並簽到</button>
      </form>
      <p class="muted small">帳號由議會秘書處發給。同一帳號在新裝置登入後，舊裝置會自動登出。</p>
    </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    $('#go').disabled = true; $('#err').textContent = '';
    try {
      const r = await api('login', { account: String(fd.get('account')).trim(), password: String(fd.get('password')) });
      if (r.ok) { store.set('vote_token', r.token); return route(); }
      $('#err').textContent = r.error;
    } catch (err) { $('#err').textContent = '網路連線失敗，請再試一次'; }
    $('#go').disabled = false;
  };
}

        <div class="row btns" style="padding-top:8px">
          <button class="btn sm" id="reload">重新讀取名單</button>
          <button class="btn sm" id="reset">清除全部簽到（新會議）</button>
        </div>
      </aside>
      <main class="a-main">
        <p class="err hidden" id="aerr" role="alert"></p>
        <section id="current"></section>
        <section class="card" style="display:flex;flex-direction:column;gap:14px">
          <h2>表決紀錄</h2>
          <div class="table-box"><table>
            <thead><tr><th>開始時間</th><th>議案</th><th>方式</th><th>門檻</th><th>出席</th><th>贊成／反對／棄權</th><th>未投</th><th>結果</th></tr></thead>
            <tbody id="hist"></tbody>
          </table></div>
        </section>
      </main>
    </div>`;

  let data = null, mode = '', dismissed = store.get('vote_dismissed');
  const form = { billId: '', title: '', kind: '一般議案', named: true, rule: '簡單多數決', seconds: 60 };
  const cur = $('#current');

  const showErr = msg => { const e = $('#aerr'); e.textContent = msg || ''; e.classList.toggle('hidden', !msg); };
  async function act(action, extra = {}) {
    showErr('');
    try {
      const r = await api(action, Object.assign({ adminToken }, extra));
      if (r.relogin) { store.set('vote_admin', null); route(); return null; }
      if (!r.ok) { showErr(r.error); return null; }
      await refresh();
      return r;
    } catch (e) { showErr('網路連線失敗，請再試一次'); return null; }
  }

  $('#out').onclick = async () => { try { await api('adminLogout', { adminToken }); } catch (e) {} store.set('vote_admin', null); route(); };
  $('#reload').onclick = () => act('reloadCouncil');
  $('#reset').onclick = () => { if (confirm('確定清除所有議員的簽到與登入狀態？（適用於新的一次會議）')) act('resetAttendance'); };

  function renderMembers() {
    $('#meeting').textContent = data.meeting || '';
    $('#pc').innerHTML = `${data.presentCount}<span style="font-size:16px;color:var(--muted)"> / ${data.total}</span>`;
    $('#members').innerHTML = data.members.map(m => `
      <div class="m-row">
        <span class="m-dot ${m.present ? 'on' : ''}"></span>
        <span class="m-dist">${esc(m.cls)}</span>
        <span class="m-name">${esc(m.name)}${m.online ? '<br><span class="m-online">已登入</span>' : ''}</span>
        <button class="btn sm" data-acct="${esc(m.account)}" data-p="${m.present ? 0 : 1}">${m.present ? '設為離席' : '手動簽到'}</button>
      </div>`).join('');
    $('#members').querySelectorAll('button').forEach(b => b.onclick = () => act('setPresence', { account: b.dataset.acct, present: b.dataset.p === '1' }));
  }

  function renderHistory() {
    $('#hist').innerHTML = data.history.length ? data.history.map(h => `
      <tr><td class="num">${esc(h.start)}</td><td class="wide">${esc(h.billId)} ${esc(h.title)}</td><td>${esc(h.mode)} · ${esc(h.kind)}</td><td>${esc(h.rule)}</td>
      <td class="num">${esc(h.present)}</td><td class="num">${esc(h.yes)} / ${esc(h.no)} / ${esc(h.abs)}</td><td class="num">${esc(h.notVoted)}</td><td style="font-weight:700">${esc(h.result)}</td></tr>`).join('')
      : '<tr><td colspan="8" class="muted">尚無紀錄</td></tr>';
  }

  function renderCurrent() {
    const v = data.vote;
    let m = 'form';
    if (v && v.status === 'voting') m = 'voting';
    else if (v && v.status === 'closed' && dismissed !== v.id) m = 'closed';
    const key = m + '|' + (v ? v.id : '');
    if (key !== mode) {
      mode = key;
      tickers.clear();
      if (m === 'form') buildForm();
      else if (m === 'voting') buildVoting(v);
      else buildClosed(v);
    }
    if (m === 'form') $('#need').textContent = `目前出席 ${data.presentCount} 人，${needTextFor(form.rule, form.kind, data.presentCount, data.total)}`;
    if (m === 'voting') fillTallies(v);
  }

  function seg(name, opts) {
    return `<div class="seg" data-seg="${name}">${opts.map(([val, label]) => `<button type="button" data-v="${esc(JSON.stringify(val))}" aria-pressed="${form[name] === val}">${label}</button>`).join('')}</div>`;
  }

  function buildForm() {
    cur.innerHTML = `
      <form class="card" id="sf" style="display:flex;flex-direction:column;gap:20px">
        <h2 style="font-size:20px">建立表決</h2>
        <div class="form-grid">
          <label class="field">議案編號
            <input name="billId" placeholder="27-001" value="${esc(form.billId)}">
            <span class="hint">輸入屆次與流水號即可，臨時動議可留空</span>
          </label>
          <label class="field">表決事項
            <input name="title" required maxlength="500" value="${esc(form.title)}">
          </label>
        </div>
        <div class="row" style="gap:24px;align-items:flex-start">
          <div class="field"><span>案別</span>${seg('kind', [['一般議案', '一般議案'], ['人事案', '人事案']])}</div>
          <div class="field"><span>表決方式</span>${seg('named', [[true, '記名'], [false, '不記名']])}</div>
          <label class="field">可決門檻（依主席宣告）
            <select name="rule">${RULES.map(r => `<option ${r === form.rule ? 'selected' : ''}>${r}</option>`).join('')}</select>
          </label>
          <div class="field"><span>投票時限</span>${seg('seconds', [[30, '30 秒'], [60, '60 秒'], [90, '90 秒'], [120, '120 秒'], [180, '3 分']])}</div>
        </div>
        <div class="row between" style="padding-top:16px;border-top:1px solid var(--soft)">
          <span class="muted" id="need"></span>
          <button class="btn primary big" type="submit" id="startBtn">開始表決</button>
        </div>
      </form>`;
    const f = $('#sf');
    f.billId.oninput = e => form.billId = e.target.value;
    f.title.oninput = e => form.title = e.target.value;
    f.rule.onchange = e => { form.rule = e.target.value; renderCurrent(); };
    f.querySelectorAll('[data-seg]').forEach(group => group.querySelectorAll('button').forEach(b => b.onclick = () => {
      form[group.dataset.seg] = JSON.parse(b.dataset.v);
      group.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      renderCurrent();
    }));
    f.onsubmit = async e => {
      e.preventDefault();
      $('#startBtn').disabled = true;
      const r = await act('start', form);
      if (r) { form.billId = ''; form.title = ''; }
      else if ($('#startBtn')) $('#startBtn').disabled = false;
    };
  }

  function chips(v) {
    return `<div class="chips">${v.status === 'voting' ? '<span class="chip live">投票中</span>' : ''}<span class="chip">${esc(v.kind)} · ${v.named ? '記名' : '不記名'} · ${esc(v.rule)}</span></div>`;
  }

  function buildVoting(v) {
    cur.innerHTML = `
      <div class="card" style="display:flex;flex-direction:column;gap:20px">
        <div class="row between" style="align-items:flex-start;gap:16px">
          <div style="display:flex;flex-direction:column;gap:8px;min-width:0;flex:1">
            ${chips(v)}
            <h2 style="font-size:22px;line-height:1.4;word-break:break-word">${esc(v.billId)} ${esc(v.title)}</h2>
            <span class="muted small">${esc(v.needText)}</span>
          </div>
          <div style="text-align:right"><div class="muted small">剩餘時間</div><div class="num" id="aleft" style="font-size:40px;font-weight:800;line-height:1">--:--</div></div>
        </div>
        <div class="tallies" id="atal"></div>
        <div class="row btns" style="justify-content:flex-end">
          <button class="btn" id="ext">延長 30 秒</button>
          <button class="btn danger" id="stop">立即截止</button>
        </div>
      </div>`;
    $('#ext').onclick = () => act('extend', { seconds: 30 });
    $('#stop').onclick = () => { if (confirm('確定立即截止本次表決？')) act('stop'); };
    const tick = () => {
      const el = $('#aleft');
      if (!el || !data.vote) return;
      const s = leftSec(data.vote.endsAt);
      el.textContent = fmt(s);
      el.style.color = s <= 10 ? 'var(--no)' : '';
    };
    tickers.add(tick); tick();
  }

  function fillTallies(v) {
    const L = labelsFor(v.kind), t = v.tallies;
    $('#atal').innerHTML = keysFor(v.kind).map(k => `
      <div class="tally"><span class="muted small"><i class="sw" style="background:${COLORS[k]}"></i>${L[k]}</span><span class="num">${t[k]}</span></div>`).join('') +
      `<div class="tally"><span class="muted small">已投／出席</span><span class="num">${t.voted} / ${t.eligible}</span></div>`;
  }

  function summaryText(v) {
    const L = labelsFor(v.kind), t = v.tallies;
    let s = `${v.billId ? v.billId + ' ' : ''}${v.title}：${v.named ? '記名' : '不記名'}表決，出席 ${t.eligible} 人，${L.yes} ${t.yes} 票、${L.no} ${t.no} 票${v.kind === '人事案' ? '' : `、棄權 ${t.abs} 票`}，未投票 ${t.notVoted} 人；依${v.rule}，表決結果：${v.result.text}${v.result.tone === 'tie' ? '，由主席裁決' : ''}。`;
    if (v.named && v.tiles) {
      const g = {};
      v.tiles.forEach(x => { if (x.s !== 'away') (g[x.s] = g[x.s] || []).push(x.cls); });
      const lines = keysFor(v.kind).concat(['none']).filter(k => g[k]).map(k => `${k === 'none' ? '未投票' : L[k]}：${g[k].join('、')}`);
      if (lines.length) s += '\n' + lines.join('\n');
    }
    return s;
  }

  function buildClosed(v) {
    cur.innerHTML = `
      <div class="card" style="display:flex;flex-direction:column;gap:18px">
        <div class="row between" style="gap:16px">
          <div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1">
            <span class="muted small">表決已截止 · ${esc(v.billId)} ${esc(v.title)}</span>
            <span style="font-size:32px;font-weight:900;color:${TONE[v.result.tone]}">${esc(v.result.text)}</span>
            <span class="muted">${esc(v.result.note)}</span>
          </div>
          <span class="ok-pill">${CHECK_SM}已寫入 Google Sheet</span>
        </div>
        <div class="tallies" id="atal"></div>
        <div class="row btns" style="justify-content:flex-end">
          <button class="btn" id="copy">複製結果文字（議事錄用）</button>
          <button class="btn primary" id="next">建立下一個表決</button>
        </div>
      </div>`;
    fillTallies(v);
    $('#copy').onclick = async () => {
      const text = summaryText(v);
      try { await navigator.clipboard.writeText(text); }
      catch (e) {
        const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove();
      }
      $('#copy').textContent = '已複製';
    };
    $('#next').onclick = () => { dismissed = v.id; store.set('vote_dismissed', v.id); renderCurrent(); };
  }

  async function refresh() {
    const r = await api('admin', { adminToken });
    if (r.relogin) { store.set('vote_admin', null); return route(); }
    if (!r.ok) return showErr(r.error);
    data = r;
    renderMembers();
    renderHistory();
    renderCurrent();
  }

  poll(refresh, POLL_MS.admin);
}

function AdminLogin() {
  $('#app').innerHTML = `
    <header class="topbar"><div class="v-bar" style="max-width:440px;margin:0 auto;justify-content:flex-start;padding:12px 24px"><div class="row" style="gap:12px;flex-wrap:nowrap"><img class="logo-w" src="${LOGO_W}" alt="學生議會標誌"><div><div class="v-title">學生議會表決系統</div><div class="v-me">秘書處登入</div></div></div></div></header>
    <div class="v-login">
      <form id="f" style="display:flex;flex-direction:column;gap:16px">
        <label class="field">秘書處密碼<input name="password" type="password" autocomplete="current-password" required></label>
        <p class="err" id="err" role="alert"></p>
        <button class="btn primary big" type="submit" id="go">登入</button>
      </form>
    </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    $('#go').disabled = true; $('#err').textContent = '';
    try {
      const r = await api('adminLogin', { password: e.target.password.value });
      if (r.ok) { store.set('vote_admin', r.adminToken); return route(); }
      $('#err').textContent = r.error;
    } catch (err) { $('#err').textContent = '網路連線失敗，請再試一次'; }
    $('#go').disabled = false;
  };
}

/* ═══════════ 投影大螢幕 ═══════════ */
function Screen() {
  document.body.style.background = '#fff';
  $('#app').innerHTML = `
    <div class="s-wrap" id="sw" title="按 F 或雙擊切換全螢幕">
      <header class="s-bar">
        <img class="s-logo" src="${LOGO_W}" alt="學生議會標誌">
        <div class="s-org"><span class="o">學生議會表決系統</span><span class="m" id="meeting"></span></div>
        <div id="corner"></div>
      </header>
      <div class="s-main">
        <div><div class="s-lab">表決事項</div><h1 class="s-title clamp2" id="title">連線中…</h1></div>
        <section class="s-facts" id="facts"></section>
        <div class="s-body" id="body"></div>
        <footer class="s-foot" id="foot"></footer>
      </div>
    </div>`;
  const toggleFs = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); };
  $('#sw').ondblclick = toggleFs;
  document.onkeydown = e => { if (location.hash.indexOf('screen') >= 0 && (e.key === 'f' || e.key === 'F')) toggleFs(); };

  let last = '', data = null;
  const tick = () => {
    const el = $('#sleft');
    if (!el || !data || !data.vote) return;
    const s = leftSec(data.vote.endsAt);
    el.textContent = fmt(s);
    el.style.color = s <= 10 ? 'var(--no)' : '';
  };
  tickers.add(tick);

  /* 依人數自動排版：8 席以內 4 欄、20 席以內 5 欄，超過時固定 5 排、欄數增加（50 席 = 10 欄 × 5 排） */
  function tiles(list, colorOf) {
    const n = Math.max(1, list.length);
    const cols = n <= 8 ? 4 : n <= 20 ? 5 : Math.ceil(n / 5);
    const rows = Math.ceil(n / cols);
    const tileW = 94 / cols;      // 以 --u 為單位
    const tileH = 26 / rows;
    const nf = Math.min(3.6, tileW * 0.2, tileH * 0.45);
    return `<div class="s-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));--nf:${nf.toFixed(2)}">${list.map(t => `
      <div class="s-tile"><span class="n" style="color:${colorOf(t)}">${esc(t.cls)}</span></div>`).join('')}</div>`;
  }

  function fact(l, v, sub) {
    return `<div class="s-fact"><span class="l">${l}</span><span class="v">${v}</span>${sub ? `<span class="s">${sub}</span>` : ''}</div>`;
  }
  const square = k => `<i style="background:${COLORS[k]}"></i>`;

  function render() {
    const v = data.vote;
    $('#meeting').textContent = data.meeting || '';
    $('#facts').style.display = v ? '' : 'none';
    if (!v) {
      $('#title').textContent = '目前沒有進行中的表決';
      $('#corner').innerHTML = '';
      $('#body').innerHTML = tiles(data.members, m => m.present ? 'var(--none)' : 'var(--away)');
      $('#foot').innerHTML = `<div class="s-fc note">深色為已簽到，淺灰為未出席</div>
        <div class="s-fc sum num"><span>出席 <b>${data.presentCount}</b></span><span>全體 ${data.total}</span></div>`;
      return;
    }
    const L = labelsFor(v.kind), t = v.tallies;
    $('#title').textContent = v.title;
    $('#corner').innerHTML = v.status === 'voting'
      ? `<div class="s-end">表決進行中</div>`
      : `<div class="s-end">表決結束</div>`;
    const resultCell = v.status === 'voting'
      ? `<div class="s-fact"><span class="l">剩餘時間</span><span class="r num" id="sleft">--:--</span><span class="s">截止後公布表決結果</span></div>`
      : `<div class="s-fact"><span class="l">表決結果</span><span class="r" style="color:${TONE[v.result.tone]}">${esc(v.result.text)}</span><span class="s">${esc(v.result.note)}</span></div>`;
    $('#facts').innerHTML =
      fact('議案編號', v.billId ? esc(v.billId) : '—') +
      fact('案別', esc(v.kind)) +
      fact('表決方式', v.named ? '記名表決' : '不記名表決') +
      fact('可決門檻', esc(v.rule), esc(v.needText)) +
      resultCell;
    $('#body').innerHTML = v.named
      ? tiles(v.tiles, x => COLORS[x.s])
      : `<div class="s-anon"><b>不記名表決</b><span>不顯示個別議員投票，僅公布票數</span></div>`;
    $('#foot').innerHTML =
      keysFor(v.kind).map(k => `<div class="s-fc"><span class="lb">${square(k)}${L[k]}</span><span class="num" style="color:${COLORS[k]}">${t[k]}</span></div>`).join('') +
      `<div class="s-fc"><span class="lb">${square('none')}未投票</span><span class="num">${t.notVoted}</span></div>
       <div class="s-fc sum num"><span>已投 <b>${t.voted}</b></span><span>出席 <b>${t.eligible}</b></span><span>全體 ${v.total}</span></div>`;
    tick();
  }

  poll(async () => {
    const r = await api('screen');
    if (!r.ok) { $('#title').textContent = r.error; return; }
    data = r;
    const sig = JSON.stringify(r.vote) + JSON.stringify(r.members) + r.meeting;
    if (sig !== last) { last = sig; render(); }
  }, POLL_MS.screen);
}

route();
</script>
</body>
</html>
